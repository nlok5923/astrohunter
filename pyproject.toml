[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astrohunt"
version = "0.1.0"
description = "A modern, cross-platform, CPU-first successor to Astrometrica for citizen-science asteroid detection (IASC-style)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "asteriod-naming" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "photutils",
    "astroquery",
    "pillow",
    "lxml",
]

[project.optional-dependencies]
dev = ["pytest"]
cnn = ["torch"]             # optional PyTorch CNN real-bogus backend (NumPy MLP is default)
web = ["fastapi", "uvicorn[standard]", "python-multipart"]   # web UI backend

[project.scripts]
astrohunt = "astrohunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astrohunt = ["schemas/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
